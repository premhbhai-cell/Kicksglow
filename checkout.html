<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout – Kicksglow</title>
<meta name="description" content="Kicksglow – sneaker cleaning kits, protection sprays, wipes, insoles and storage crates. Faridabad, Haryana.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>
<main class="wrap"><div class="pghead"><h1>Checkout</h1></div>
<div class="two" id="co">
  <form class="box" id="coform"><h2>Delivery details</h2>
    <div class="f">
      <div><label for="name">Full name</label><input id="name" name="name" required autocomplete="name"></div>
      <div><label for="phone">Mobile number</label><input id="phone" name="phone" required inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 digit number"></div>
      <div class="full"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
      <div class="full"><label for="addr">Full address</label><textarea id="addr" name="address" rows="3" required autocomplete="street-address"></textarea></div>
      <div><label for="city">City</label><input id="city" name="city" required autocomplete="address-level2"></div>
      <div><label for="state">State</label><input id="state" name="state" required autocomplete="address-level1"></div>
      <div><label for="pin">Pincode</label><input id="pin" name="pin" required inputmode="numeric" maxlength="6" autocomplete="postal-code"></div>
    </div>
    <h2 style="margin-top:26px">Payment</h2>
    <div class="pay">
      <label><input type="radio" name="pay" value="cod" checked> <span>Cash on Delivery</span></label>
      <label><input type="radio" name="pay" value="online"> <span>Pay online (UPI / Card)</span></label>
    </div>
    <button class="btn block" style="margin-top:14px;font-size:15px">PLACE ORDER</button>
  </form>
  <aside class="box sum"><h2>Order summary</h2><div id="sum"></div></aside>
</div></main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
